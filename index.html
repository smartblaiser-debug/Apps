<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>StudyNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#02040f;--c:#07112b;--t:#eef6ff;--m:#8fa8d6;--p:#7dd3fc;--a:#2563eb;--b:#12306b;--g:linear-gradient(135deg,#2563eb,#06b6d4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;color:var(--t);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(600px 380px at 85% -5%,#1e3a8a66,transparent),radial-gradient(520px 340px at -10% 30%,#2563eb33,transparent),var(--bg);background-attachment:fixed}
#app{max-width:760px;margin:auto;padding:12px 14px 92px}
.card{background:linear-gradient(160deg,#0a1a3c,#060e24);border:1px solid var(--b);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0008}
input,select,textarea{font-family:inherit;width:100%;padding:13px 14px;margin:5px 0;border:1px solid var(--b);border-radius:14px;background:#030816;color:var(--t);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid #2563eb66;border-color:var(--a)}
button{font:inherit;background:var(--g);color:#fff;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;font-weight:700;box-shadow:0 8px 22px #2563eb44}
button.g{background:#0b1a3a;color:#38bdf8;border:1px solid #2563eb66;box-shadow:none}button.r{background:#dc2626}
nav{position:fixed;bottom:0;left:0;right:0;background:#030816ee;backdrop-filter:blur(14px);border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--m);padding:4px;cursor:pointer}nav a.on{color:#38bdf8;font-weight:800}nav a b{display:block;font-size:20px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--g);display:inline-flex;align-items:center;justify-content:center;font-weight:800;vertical-align:middle;margin-right:8px;border:2px solid #2563eb55}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}.m{color:var(--m);font-size:13px}
.tick{color:#fff;background:#1d9bf0;border-radius:50%;font-size:10px;padding:1px 5px;margin-left:4px;box-shadow:0 0 8px #1d9bf0}
img.pm,video.pm{max-width:100%;border-radius:14px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:#030816;color:var(--t);border:1px solid var(--b);margin:8px 0;border-radius:14px;box-shadow:none;font-weight:500}
.opt.ok{background:#16a34a}.opt.no{background:#dc2626}
.bub{background:#030816;border-radius:16px;padding:9px 12px;margin:7px 0}.bub.me{background:var(--g)}
h2,h3{margin:8px 0}.hero{text-align:center;padding:22px 0}.big{font-size:38px;line-height:1.1;margin:8px 0;font-weight:900;letter-spacing:-1px}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0;font-size:30px;font-weight:900}
.eb{color:#2563eb;font-weight:800;letter-spacing:2px;font-size:13px;margin-top:18px}
.chip{background:#0a1a3c;border:1px solid var(--b);border-radius:999px;padding:7px 12px;font-size:13px}
#sp{position:fixed;inset:0;z-index:99;background:radial-gradient(500px 400px at 50% 45%,#2563eb55,#0ea5e933 45%,#000 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#sp.out{opacity:0;pointer-events:none}#sp img{filter:drop-shadow(0 0 26px #2563eb);animation:pu 1.6s ease-in-out infinite}
#sp b{margin-top:14px;letter-spacing:6px;font-size:14px;color:#ffd0e0}
.dots{display:flex;gap:12px;margin-top:26px}.dots i{width:14px;height:14px;border-radius:50%;background:#2563eb;box-shadow:0 0 14px #2563eb;animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.18s;opacity:.7}.dots i:nth-child(3){animation-delay:.36s;opacity:.45}
@keyframes bn{50%{transform:translateY(-12px)}}@keyframes pu{50%{transform:scale(1.07)}}

.tb{display:flex;align-items:center;gap:10px;padding:6px 2px 10px;position:sticky;top:0;z-index:5}.tb b{font-size:18px;font-weight:800}
.hb{background:var(--g);border-radius:24px;padding:24px 22px;box-shadow:0 18px 40px #2563eb40}.hb h1{margin:4px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.5px}.hb p{margin:0;opacity:.92}.hb .m{color:#ffe4ec;font-weight:600}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.st div{background:#07112b;border:1px solid var(--b);border-radius:18px;padding:14px;text-align:center}.st b{display:block;font-size:24px;font-weight:800}.st span{color:var(--m);font-size:12px}
.sh{margin:22px 0 8px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--m);font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ex{background:var(--x);border-radius:22px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 28px #0006;transition:transform .15s}.ex:hover{transform:translateY(-3px)}.ex b{font-size:22px;font-weight:800}.ex span{font-size:12.5px;opacity:.9}.ex em{font-style:normal;font-weight:700;margin-top:10px;font-size:13px}
.ic{width:42px;height:42px;border-radius:14px;background:#ffffff30;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.sj{cursor:pointer;margin:0;display:flex;flex-direction:column;gap:4px}.sj:hover{border-color:var(--a)}.bd{width:42px;height:42px;border-radius:14px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.pg{height:8px;background:#030816;border-radius:99px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--g);border-radius:99px}
.brand{display:none}
nav a svg{display:block;margin:0 auto 2px}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:230px;flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 14px;border-top:0;border-right:1px solid var(--b)}nav a{display:flex;align-items:center;gap:12px;text-align:left;font-size:14px;padding:12px 14px;border-radius:14px;flex:none}nav a svg{margin:0}nav a.on{background:#2563eb22}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:0 0 18px 4px}#app{margin-left:250px;max-width:880px;padding-bottom:30px}.tb .lg{display:none}}
.fl{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px;cursor:pointer}.fl i{width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px #25d36688}.fl span{background:#fff;color:#111;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px}@media(min-width:900px){.fl{bottom:20px}}
.dots i{background:#38bdf8!important;box-shadow:0 0 16px #38bdf8!important}#sp{background:radial-gradient(500px 420px at 50% 45%,#1d4ed855,#02040f 70%)}.pill{padding:8px 16px;border-radius:99px;background:#0a1a3c;border:1px solid var(--b);cursor:pointer;font-weight:600;font-size:13px;color:var(--m)}.pill.on{background:var(--g);color:#fff;border-color:transparent}.th{max-height:56vh;overflow:auto}.bub small{display:block;opacity:.75;font-weight:700}.bub.me{margin-left:18%}.bub:not(.me){margin-right:18%}

:root{--bg:#eef4ff;--c:#fff;--t:#0f1b3d;--m:#5b6b8f;--p:#2563eb;--a:#2563eb;--b:#dbe5f8}
body{background:radial-gradient(620px 380px at 90% -5%,#7c3aed26,transparent),radial-gradient(560px 360px at -10% 25%,#06b6d430,transparent),radial-gradient(500px 300px at 60% 100%,#f9731622,transparent),#eef4ff;background-attachment:fixed}
.card{background:#fff;border:1px solid #dbe5f8;box-shadow:0 8px 24px #2563eb14}
input,select,textarea{background:#f5f8ff;color:#0f1b3d;border-color:#d3def5}
button.g{background:#eaf1ff;color:#2563eb;border:1px solid #bcd0f7}
button{box-shadow:0 8px 20px #2563eb40}
nav{background:#fffffff2;border-color:#dbe5f8;box-shadow:0 -6px 24px #2563eb14}nav a.on{color:#2563eb}
@media(min-width:900px){nav a.on{background:#2563eb18}}
.tb{background:#eef4ffee;backdrop-filter:blur(10px)}
.hb{background:linear-gradient(120deg,#2563eb,#7c3aed 55%,#ec4899);box-shadow:0 16px 36px #7c3aed44}
.st div{background:#fff}.st div:nth-child(1){background:linear-gradient(160deg,#dbeafe,#fff);border-color:#93c5fd}.st div:nth-child(1) b{color:#2563eb}
.st div:nth-child(2){background:linear-gradient(160deg,#ffedd5,#fff);border-color:#fdba74}.st div:nth-child(2) b{color:#ea580c}
.st div:nth-child(3){background:linear-gradient(160deg,#dcfce7,#fff);border-color:#86efac}.st div:nth-child(3) b{color:#16a34a}
.opt{background:#f5f8ff;color:#0f1b3d;border-color:#d3def5}.opt.ok,.opt.no{color:#fff}
.bub{background:#eaf1ff;color:#0f1b3d}.bub.me{background:var(--g);color:#fff}
.pill{background:#eaf1ff;color:#2563eb;border-color:#cfdcf7}.pill.on{background:var(--g);color:#fff}
.chip{background:#fff;color:#2563eb;border-color:#cfdcf7}
.pg{background:#dbe5f8}.sh{color:#2563eb}.sj:hover{border-color:#2563eb}
.av{border-color:#fff;box-shadow:0 2px 8px #2563eb33;color:#fff}
.grad{background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{color:#0f1b3d}.eb{color:#f97316}

 <div id="er" style="color:#ff6b6b"></div><button onclick="${su?'signup()':'login()'}" style="width:100%;padding:15px">${su?'Sign up':'Sign in'}</button>
 <p class="m" style="text-align:center">${su?'Have an account?':'New here?'} <a href="#" onclick="mode='${su?'login':'signup'}';R();return false" style="color:var(--p)">${su?'Sign in':'Create account'}</a> · <a href="#" onclick="mode='land';R();return false" style="color:var(--p)">Back</a></p>
 </div>`}
function signup(){const n=v('fn').trim(),un=v('un').trim().toLowerCase().replace(/\s/g,''),em=v('em').trim().toLowerCase(),pw=v('pw'),ar=v('ar'),er=m=>{const x=$('#er');if(x)x.textContent=m};
 if(!n||!un||!em||pw.length<6)return er('Fill all fields; password needs 6+ characters.');
 shrink($('#pp').files[0],p=>auth.createUserWithEmailAndPassword(em,pw).then(c=>db.collection('users').where('un','==',un).get().then(q=>{if(!q.empty){c.user.delete();return er('Username already taken.')}
  D.users.push({id:c.user.uid,name:n,un,em,pic:p,area:ar,following:[]});save();sync()})).catch(x=>er(x.message.replace('Firebase: ',''))))}
function login(){auth.signInWithEmailAndPassword(v('em').trim().toLowerCase(),v('pw')).catch(x=>$('#er').textContent='Wrong email or password.')}
function out(){mode='land';auth.signOut()}
function home(){const n=Object.values(D.qs).reduce((a,l)=>a+l.length,0);
 const EX=[['JAMB','Unified Tertiary Matriculation Exam','#2563eb,#06b6d4'],['WAEC','West African Senior School Certificate','#059669,#84cc16'],['NECO','National Examinations Council SSCE','#f97316,#ec4899']];
 return `<div class="hb"><div class="m">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${greet()}, ${e(me.name.split(' ')[0])}</h1><p>Ready to ace your exams? Pick an exam and start practising.</p></div>
 <div class="st"><div><b>${n}</b><span>Questions</span></div><div><b>${Object.keys(D.qs).length}</b><span>Subjects</span></div><div><b>${fol(me.id)}</b><span>Followers</span></div></div>
 <div class="sh">Choose your exam</div><div class="gr">${EX.map(x=>`<div class="ex" style="--x:linear-gradient(135deg,${x[2]})" onclick="qz={ex:'${x[0]}'};tab='prac';R()"><div class="ic">${I.prac}</div><b>${x[0]}</b><span>${x[1]}</span><em>Start practice →</em></div>`).join('')}</div>
 <div class="sh">Announcements</div>${D.ann.map(a=>`<div class="card" style="margin:8px 0"><b>${e(a.t)}</b><div>${e(a.txt)}</div><div class="m" style="margin-top:4px">${new Date(a.ts).toLocaleString()}</div></div>`).join('')}`}
function prac(){
 if(!qz)return `<h2>Practice</h2><div class="card">Pick an exam on Home.</div>`;
 if(!qz.sub)return `<h2>${qz.ex} — choose subject</h2><div class="gr">${Object.keys(D.qs).map((s,i)=>`<div class="card sj" style="border-top:4px solid ${PC[i%6]}" onclick="qz.sub='${e(s)}';qz.i=0;qz.sc=0;qz.a=null;R()"><span class="bd" style="background:${PC[i%6]}">${e(s)[0]}</span><b>${e(s)}</b><span class="m">${D.qs[s].length} questions</span></div>`).join('')}</div>`;
 const L=D.qs[qz.sub];if(qz.i>=L.length)return `<div class="card hero"><h2>Score: ${qz.sc}/${L.length}</h2><div class="m">${qz.ex} · ${e(qz.sub)}</div><button onclick="qz.sub=null;R()">Another subject</button></div>`;
 const q=L[qz.i];return `<div class="m">${qz.ex} · ${e(qz.sub)} · Question ${qz.i+1} of ${L.length}</div><div class="pg"><i style="width:${qz.i/L.length*100}%"></i></div><div class="card"><b>${e(q.q)}</b>${q.o.map((o,k)=>`<button class="opt ${qz.a==null?'':k==q.a?'ok':k==qz.a?'no':''}" onclick="ans(${k})">${'ABCD'[k]}. ${e(o)}</button>`).join('')}${qz.a!=null?`<button onclick="qz.i++;qz.a=null;R()">Next →</button>`:''}</div>`}
function ans(k){if(qz.a!=null)return;qz.a=k;if(k==D.qs[qz.sub][qz.i].a)qz.sc++;R()}
function comm(){const q=(view.s2||'').toLowerCase(),f=view.f||'all';
 const ppl=q?D.users.filter(u=>u.id!=me.id&&!u.banned&&(u.un.includes(q)||(u.area||'').toLowerCase().includes(q))):D.users.filter(u=>u.id!=me.id&&!u.banned&&!me.following.includes(u.id)).slice(0,3);
 const ps=D.posts.filter(p=>!U(p.u).banned&&(f=='all'||p.u==me.id||me.following.includes(p.u))).slice().reverse();
 return `<h2>Community</h2><div class="card"><textarea id="pt" rows="2" placeholder="What are you studying today?"></textarea><input id="pi" type="file" accept="image/*"><button onclick="post()">Post</button></div>
 <input placeholder="Search people by username or area of study" value="${e(view.s2||'')}" oninput="view.s2=this.value;clearTimeout(window.T);window.T=setTimeout(R,300)">
 <div class="sh">${q?'Search results':'People to follow'}</div>${ppl.map(u=>`<div class="card row" style="margin:8px 0"><span onclick="view.p='${u.id}';tab='prof';R()" class="row sp" style="cursor:pointer">${av(u)}<span>${nm(u)}<div class="m">${e(u.area)} · ${fol(u.id)} followers</div></span></span>${fbtn(u)}</div>`).join('')||'<div class="m">No one found.</div>'}
 <div class="row" style="margin:14px 0"><span class="pill ${f=='all'?'on':''}" onclick="view.f='all';R()">For you</span><span class="pill ${f=='fol'?'on':''}" onclick="view.f='fol';R()">Following</span></div>
 ${ps.map(p=>{const u=U(p.u),l=p.l||[],c=p.c||[];return `<div class="card"><div class="row"><span onclick="view.p='${u.id}';tab='prof';R()" style="cursor:pointer">${av(u)}</span><div class="sp">${nm(u)}<div class="m">${new Date(p.ts).toLocaleString()}</div></div>${u.id!=me.id?fbtn(u):''}</div><div style="margin-top:8px">${e(p.txt)}</div>${p.img?`<img class="pm" src="${p.img}">`:''}
 <div class="row" style="margin-top:10px"><span class="pill ${l.includes(me.id)?'on':''}" onclick="lk(${p.id})">${I2} ${l.length}</span><span class="pill" onclick="cm(${p.id})">Comment ${c.length}</span></div>${c.map(x=>`<div class="bub"><small>${e(U(x.u).name)}</small>${e(x.t)}</div>`).join('')}</div>`}).join('')||`<div class="card m">${f=='fol'?'Follow people to fill your feed.':'No posts yet — be the first!'}</div>`}`}
function lk(id){const p=D.posts.find(x=>x.id==id);p.l=p.l||[];p.l=p.l.includes(me.id)?p.l.filter(x=>x!=me.id):[...p.l,me.id];save();R()}
function cm(id){const t=prompt('Write a comment');if(!t)return;const p=D.posts.find(x=>x.id==id);(p.c=p.c||[]).push({u:me.id,t});save();R()}
const fbtn=u=>`<button class="${me.following.includes(u.id)?'g':''}" onclick="tf('${u.id}')">${me.following.includes(u.id)?'Following':'Follow'}</button>`;
function tf(id){const f=me.following;me.following=f.includes(id)?f.filter(x=>x!=id):[...f,id];save();R()}
function post(){const t=v('pt').trim();shrink($('#pi').files[0],i=>{if(!t&&!i)return;D.posts.push({id:Date.now(),u:me.id,txt:t,img:i,ts:Date.now()});save();R()})}
const dmk=id=>'dm:'+[me.id,id].sort().join(':');
function chat(){const c=view.c;
 if(!c){const q=(view.s||'').toLowerCase(),gs=D.groups.filter(g=>g.members.includes(me.id)),dms=[...new Set(D.msgs.filter(m=>m.c.startsWith('dm:')&&m.c.split(':').includes(me.id)).map(m=>m.c))];
  const ppl=q?D.users.filter(u=>u.id!=me.id&&!u.banned&&(u.un.includes(q)||u.name.toLowerCase().includes(q))):[];
  const row=(k,a,t,sub)=>`<div class="card row" style="margin:8px 0;cursor:pointer" onclick="view.c='${k}';R()">${a}<div class="sp"><b>${e(t)}</b><div class="m">${sub}</div></div></div>`;
  return `<h2>Messages</h2><input placeholder="Search a student to message" value="${e(view.s||'')}" oninput="view.s=this.value;clearTimeout(window.T);window.T=setTimeout(R,300)">
  ${ppl.map(u=>row(dmk(u.id),av(u),u.name,'Start a conversation · @'+e(u.un))).join('')}
  <div class="sh">Groups</div>${gs.map(g=>row('g:'+g.id,`<span class="av">${e(g.name[0])}</span>`,g.name,g.members.length+' members')).join('')||'<div class="m">Join or create a group in the Groups tab.</div>'}
  <div class="sh">Direct messages</div>${dms.map(k=>{const o=U(k.split(':').find(x=>x!='dm'&&x!=me.id));return row(k,av(o),o.name,'@'+e(o.un))}).join('')||'<div class="m">No conversations yet. Search a name above.</div>'}`}
 const g=c[0]=='g'?D.groups.find(x=>x.id==c.slice(2)):null,o=g?null:U(c.split(':').find(x=>x!='dm'&&x!=me.id));
 return `<div class="row"><button class="g" onclick="view.c=null;R()">←</button>${g?`<span class="av">${e(g.name[0])}</span><b class="sp">${e(g.name)}${g.members.length>=500?'<span class="tick">✓</span>':''}<div class="m">${g.members.length} members</div></b>`:`${av(o)}<span class="sp">${nm(o)}</span>`}</div>
 <div class="card th" id="th">${D.msgs.filter(m=>m.c==c&&!U(m.u).banned).map(m=>`<div class="bub ${m.u==me.id?'me':''}">${g&&m.u!=me.id?`<small>${e(U(m.u).name)}</small>`:''}${e(m.txt)}${m.type=='img'?`<img class="pm" src="${m.media}">`:m.type=='vid'?`<video class="pm" controls src="${m.media}"></video>`:''}<div class="m" style="font-size:10px;text-align:right;color:inherit;opacity:.7">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<span class="m">Say hello!</span>'}</div>
 <div class="card"><input id="ct" placeholder="Type a message…" onkeydown="if(event.key=='Enter')send()"><div class="row"><label class="pill">Photo / Video<input type="file" accept="image/*,video/*" hidden onchange="sendf(this)"></label><label class="pill">Record video<input type="file" accept="video/*" capture="user" hidden onchange="sendf(this)"></label><span class="sp"></span><button onclick="send()">Send</button></div></div>`}
function send(){const t=v('ct').trim();if(!t)return;D.msgs.push({c:view.c,u:me.id,txt:t,ts:Date.now()});save();R()}
function sendf(i){const f=i.files[0];if(!f)return;const vid=f.type.startsWith('video');(vid?up:shrink)(f,d=>{D.msgs.push({c:view.c,u:me.id,txt:v('ct'),media:d,type:vid?'vid':'img',ts:Date.now()});save();R()})}
function grp(){const q=(view.g||'').toLowerCase();
 return `<h2>Groups</h2><div class="card"><input id="gn" placeholder="New group name"><input id="gp" type="file" accept="image/*"><button onclick="mkg()">Create group</button></div>
 <input placeholder="Search groups" value="${e(view.g||'')}" oninput="view.g=this.value;clearTimeout(window.T);window.T=setTimeout(R,300)">
 ${D.groups.filter(g=>g.name.toLowerCase().includes(q)).map(g=>{const j=g.members.includes(me.id),ad=g.admin==me.id,ok=Date.now()-g.changed>2592e6;return `<div class="card"><div class="row">${g.pic?`<img class="av" src="${g.pic}">`:'<span class="av">${e(g.name[0])}</span>'}<div class="sp"><b>${e(g.name)}</b>${g.members.length>=500?'<span class="tick">✓</span>':''}<div class="m">${g.members.length} members</div></div>${j?`<button onclick="view.c='g:${g.id}';tab='chat';R()">Open chat</button>`:''}<button class="${j?'g':''}" onclick="jg(${g.id})">${j?'Leave':'Join'}</button></div>${ad?`<div class="m" style="margin-top:8px">Admin: ${ok?'<a href="#" onclick="rg('+g.id+');return false" style="color:var(--p)">rename / change picture</a>':'name & picture can change again '+new Date(g.changed+2592e6).toLocaleDateString()}</div>`:''}</div>`}).join('')||'<div class="card m">No groups found.</div>'}`}
function mkg(){const n=v('gn').trim();if(!n)return;shrink($('#gp').files[0],p=>{D.groups.push({id:Date.now(),name:n,pic:p,admin:me.id,members:[me.id],changed:0});save();R()})}
function jg(id){const g=D.groups.find(x=>x.id==id);g.members=g.members.includes(me.id)?g.members.filter(x=>x!=me.id):[...g.members,me.id];save();R()}
function rg(id){const g=D.groups.find(x=>x.id==id),n=prompt('New group name',g.name);if(!n)return;const i=document.createElement('input');i.type='file';i.accept='image/*';const fin=p=>{g.name=n;if(p)g.pic=p;g.changed=Date.now();save();R()};i.onchange=()=>shrink(i.files[0],fin);if(confirm('Also change the picture? (Only one change allowed per month)'))i.click();else fin('')}
function prof(){const id=view.p||me.id,u=U(id);return `<div class="card hero">${u.pic?`<img class="av" style="width:90px;height:90px" src="${u.pic}">`:av(u)}<h2>${e(u.name)}${fol(u.id)>=100?'<span class="tick">✓</span>':''}</h2><div class="m">@${e(u.un)} · ${e(u.area||'')}</div>
 <div class="row" style="justify-content:center;margin:10px"><b>${fol(u.id)}</b> followers · <b>${u.following.length}</b> following · <b>${D.posts.filter(p=>p.u==u.id).length}</b> posts</div>
 ${id==me.id?`<button class="g" onclick="out()">Sign out</button>`:`${fbtn(u)} <button onclick="view.c=dmk('${u.id}');view.p=null;tab='chat';R()">Message</button> <button class="g" onclick="view.p=null;tab='comm';R()">Back</button>`}</div>`}
function adm(){return `<h2>Admin panel</h2><div class="card"><b>Post announcement</b><input id="at" placeholder="Title"><textarea id="ax" rows="2" placeholder="Message everyone will see"></textarea><button onclick="D.ann.unshift({t:v('at'),txt:v('ax'),ts:Date.now()});save();R()">Publish</button></div>
 <div class="card"><b>Add question</b><select id="qe">${Object.keys(D.qs).map(s=>`<option>${e(s)}</option>`).join('')}</select><input id="qn" placeholder="New subject (optional)"><input id="qq" placeholder="Question"><input id="o0" placeholder="Option A"><input id="o1" placeholder="Option B"><input id="o2" placeholder="Option C"><input id="o3" placeholder="Option D"><select id="qa"><option value="0">Correct: A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button onclick="addq()">Add</button></div>
 <div class="card"><b>Users</b>${D.users.filter(u=>u.em!=ADMIN).map(u=>`<div class="row" style="margin-top:8px">${av(u)}<span class="sp">${nm(u)}${u.banned?' <span class="m">(banned)</span>':''}</span><button class="${u.banned?'g':'r'}" onclick="ban('${u.id}')">${u.banned?'Unban':'Ban'}</button></div>`).join('')||'<span class="m">No users yet.</span>'}
 <div class="m" style="margin-top:8px">Ban users who post pornographic content; their posts and messages are hidden.</div></div>`}
function addq(){const s=v('qn').trim()||v('qe'),o=[0,1,2,3].map(i=>v('o'+i));if(!v('qq')||o.some(x=>!x))return alert('Fill question and all options');(D.qs[s]=D.qs[s]||[]).push(Q(v('qq'),o,+v('qa')));save();alert('Added');R()}
function ban(id){const u=U(id);u.banned=!u.banned;save();R()}

 const T=[['home',I.home,'Home'],['prac',I.prac,'Practice'],['comm',I.comm,'Community'],['chat',I.chat,'Chat'],['grp',I.grp,'Groups'],['prof',I.prof,'Profile']];if(isAdm())T.push(['adm',I.adm,'Admin']);
 const F={home,prac,comm,chat,grp,prof,adm};a.innerHTML=`<div class="tb"><span class="lg">${L(34)}</span><b class="lg">StudyNest</b><span class="sp"></span><span onclick="tab='prof';view.p=null;R()" style="cursor:pointer">${av(me)}</span></div>`+F[tab]()+`<div class="fl" onclick="tab='comm';view.p=null;R()"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg></i><span>Join community</span></div><nav><div class="brand">${L(36)}StudyNest</div>${T.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';view.p=null;view.c=null;R()">${t[1]}<span>${t[2]}</span></a>`).join('')}</nav>`;const th=$('#th');if(th)th.scrollTop=1e9;}
R();
const sp=document.createElement('div');sp.id='sp';sp.innerHTML=L(250)+'<div class="dots"><i></i><i></i><i></i></div>';document.body.appendChild(sp);setTimeout(()=>sp.classList.add('out'),2400);setTimeout(()=>sp.remove(),3100);
</script></body></html>
